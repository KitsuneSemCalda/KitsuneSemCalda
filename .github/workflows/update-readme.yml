name: Update README stats

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stars and external contributions via GraphQL
        id: data
        run: |
          result=$(gh api graphql -f query='
            query {
              user(login: "KitsuneSemCalda") {
                repositories(first: 10, ownerAffiliations: OWNER, isFork: false, orderBy: {field: STARGAZERS, direction: DESC}) {
                  nodes {
                    name
                    description
                    primaryLanguage { name }
                    stargazerCount
                    url
                  }
                }
                contributionsCollection {
                  pullRequestContributionsByRepository(maxRepositories: 25) {
                    repository {
                      name
                      nameWithOwner
                      stargazerCount
                      url
                      owner { login }
                    }
                    contributions { totalCount }
                  }
                }
              }
            }
          ')
          echo "data=$result" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate tables and update README
        env:
          GH_DATA: ${{ steps.data.outputs.data }}
        run: |
          # Most starred (exclude the profile repo itself)
          stars_rows=""
          while IFS= read -r node; do
            name=$(echo "$node" | jq -r '.name')
            desc=$(echo "$node" | jq -r '.description // "—"')
            lang=$(echo "$node" | jq -r '.primaryLanguage.name // "—"')
            url=$(echo "$node" | jq -r '.url')
            stars_rows+="| [**$name**]($url) | $lang | $desc |\n"
          done < <(echo "$GH_DATA" | jq -c '.data.user.repositories.nodes[] | select(.name != "KitsuneSemCalda")' | head -n 5)

          stars_rows="${stars_rows:-| — | — | No starred repositories yet |\n}"
          stars_table="| Project | Lang | Description |\n|---|---|---|\n${stars_rows}"

          # External contributions (repos not owned by KitsuneSemCalda), ranked by PR count
          contrib_rows=""
          while IFS= read -r node; do
            name=$(echo "$node" | jq -r '.repository.nameWithOwner')
            url=$(echo "$node" | jq -r '.repository.url')
            stars=$(echo "$node" | jq -r '.repository.stargazerCount')
            prs=$(echo "$node" | jq -r '.contributions.totalCount')
            contrib_rows+="| [**$name**]($url) | $prs | $stars |\n"
          done < <(echo "$GH_DATA" | jq -c '.data.user.contributionsCollection.pullRequestContributionsByRepository[] | select(.repository.owner.login != "KitsuneSemCalda")' | jq -cs 'sort_by(-.contributions.totalCount)[]' | head -n 5)

          contrib_rows="${contrib_rows:-| — | — | No external contributions yet |\n}"
          contrib_table="| Project | PRs | Stars |\n|---|---|---|\n${contrib_rows}"

          awk -v table="$stars_table" '
            /<!-- TOP_STARS:START -->/ {
              print
              gsub(/\\n/, "\n", table)
              printf "%s", table
              in_block = 1
              next
            }
            /<!-- TOP_STARS:END -->/ { in_block = 0; print; next }
            !in_block
          ' README.md > README.tmp && mv README.tmp README.md

          awk -v table="$contrib_table" '
            /<!-- CONTRIBUTIONS:START -->/ {
              print
              gsub(/\\n/, "\n", table)
              printf "%s", table
              in_block = 1
              next
            }
            /<!-- CONTRIBUTIONS:END -->/ { in_block = 0; print; next }
            !in_block
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update stats and contributions [skip ci]"
            git push
          fi
